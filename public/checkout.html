<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Nexlify</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding: 40px 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 30px; color: #1F2937; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #1F2937; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; }
    input:focus { outline: none; border-color: #10B981; }
    #card-element { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; min-height: 44px; }
    .price-box { background: #f0fdf4; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center; border: 1px solid #10B981; }
    .price-box .amount { font-size: 2em; font-weight: bold; color: #10B981; }
    .price-box .label { color: #6B7280; margin-top: 4px; }
    button { width: 100%; padding: 14px; background: #FBBF24; color: #1F2937; border: none; border-radius: 6px; font-size: 1.1em; font-weight: 700; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
    button:hover { background: #F59E0B; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error { color: #e74c3c; margin-top: 10px; font-size: 0.9em; }
    .back { display: block; text-align: center; margin-top: 20px; color: #10B981; text-decoration: none; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checkout</h1>
    <div class="price-box">
      <div class="amount">€37.00</div>
      <div class="label">Nexlify Digital Product</div>
    </div>
    <form id="payment-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Card Details</label>
        <div id="card-element"></div>
        <div id="card-errors" class="error"></div>
      </div>
      <button type="submit" id="submit-btn">Pay €37.00</button>
    </form>
    <a href="/index.html" class="back">← Back to home</a>
  </div>

  <script src="/tracking.js" defer></script>
  <script src="/posthog-init.js" defer></script>
  <script>
    const stripe = Stripe('pk_test_51TWbPTJOfEdgZVfKcM5CkfN2f8WOZZcSDLuXzhHkyEdzvQ8vmw4PSrPQvWa60fjKHeQjlRHehRdQLwTR120oG4RY00FmhrAl4i');
    const elements = stripe.elements();
    const cardElement = elements.create('card', {
      style: {
        base: { fontSize: '16px', color: '#1F2937', '::placeholder': { color: '#9CA3AF' } }
      }
    });
    cardElement.mount('#card-element');

    const form = document.getElementById('payment-form');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const cardErrors = document.getElementById('card-errors');

    cardElement.addEventListener('change', (e) => {
      cardErrors.textContent = e.error ? e.error.message : '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      try {
        const response = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value })
        });

        if (!response.ok) throw new Error('Failed to create payment');
        const { clientSecret, amount } = await response.json();

        const result = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: { email: emailInput.value }
          }
        });

        if (result.error) {
          cardErrors.textContent = result.error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Pay €37.00';
        } else if (result.paymentIntent.status === 'succeeded') {
          const eventId = 'stripe_' + result.paymentIntent.id;
          if (typeof fbq !== 'undefined') {
            fbq('track', 'Purchase', { value: 37, currency: 'EUR', event_id: eventId });
          }
          window.location.href = '/thank-you.html?v=' + amount;
        }
      } catch (error) {
        cardErrors.textContent = 'Payment failed. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pay €37.00';
      }
    });
  </script>
</body>
</html>
