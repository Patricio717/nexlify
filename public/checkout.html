<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Nexlify</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding: 40px 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 30px; color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input, #card-element { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; }
    input:focus, #card-element:focus { outline: none; border-color: #667eea; }
    #card-element { min-height: 40px; }
    .price-box { background: #f0f0f0; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: center; }
    .price-box p { font-size: 2em; font-weight: bold; color: #667eea; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 1.1em; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
    button:hover { background: #764ba2; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error { color: #e74c3c; margin-top: 10px; font-size: 0.9em; }
    .loading { display: none; text-align: center; }
    .loading.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checkout</h1>

    <div class="price-box">
      <p>€37.00</p>
      <p style="font-size: 1em; font-weight: normal; color: #666;">Nexlify Digital Product</p>
    </div>

    <form id="payment-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="card-element">Card Details</label>
        <div id="card-element"></div>
        <div id="card-errors" class="error"></div>
      </div>

      <button type="submit" id="submit-btn">Pay €37.00</button>
      <div class="loading" id="loading">
        <p>Processing payment...</p>
      </div>
    </form>
  </div>

  <script src="/tracking.js" defer></script>
  <script src="/posthog-init.js" defer></script>
  <script>
    const stripe = Stripe(document.currentScript.getAttribute('data-key') || '');
    const cardElement = stripe.elements().create('card');
    cardElement.mount('#card-element');

    const form = document.getElementById('payment-form');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const loading = document.getElementById('loading');
    const cardErrors = document.getElementById('card-errors');

    cardElement.addEventListener('change', (event) => {
      cardErrors.textContent = event.error ? event.error.message : '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      loading.classList.add('active');

      try {
        const response = await fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value })
        });

        const { clientSecret, amount } = await response.json();

        const result = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: { email: emailInput.value }
          }
        });

        if (result.error) {
          cardErrors.textContent = result.error.message;
          submitBtn.disabled = false;
          loading.classList.remove('active');
        } else if (result.paymentIntent.status === 'succeeded') {
          const eventId = 'stripe_' + result.paymentIntent.id;
          fbq('track', 'Purchase', { value: amount / 100, currency: 'EUR', event_id: eventId });

          setTimeout(() => {
            window.location.href = '/thank-you.html?v=' + amount;
          }, 300);
        }
      } catch (error) {
        cardErrors.textContent = error.message;
        submitBtn.disabled = false;
        loading.classList.remove('active');
      }
    });

    fetch('/api/stripe-key')
      .then(r => r.json())
      .then(d => {
        const stripe = Stripe(d.key);
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');
      });
  </script>
</body>
</html>
