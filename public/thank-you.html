<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Nexlify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { background: white; padding: 60px 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 600px; }
    .checkmark { font-size: 4em; margin-bottom: 20px; }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #666; margin: 15px 0; font-size: 1.1em; }
    a { display: inline-block; margin-top: 30px; background: #667eea; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; }
    a:hover { background: #764ba2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark">✓</div>
    <h1>Payment Received!</h1>
    <p>Thank you for your purchase. Your order has been confirmed.</p>
    <p>Check your email for access details and next steps.</p>
    <a href="/">Back to Home</a>
  </div>
  <script src="/tracking.js" defer></script>
  <script src="/posthog-init.js" defer></script>

</html>
